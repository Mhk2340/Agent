name: Phase H Android CPU runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase-h-android-cpu.yml'
      - 'app/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/phase-h-android-cpu.yml'
      - 'app/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  android-cpu-runtime:
    runs-on: ubuntu-latest
    # PROVISIONAL - pending GEN-PERF-1
    timeout-minutes: 120
    steps:
      - name: Check out project source
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # PROVISIONAL - pending GEN-PERF-1
          java-version: '17'
          cache: gradle

      - name: Install Python for the pinned CMake package
        uses: actions/setup-python@v5
        with:
          # PROVISIONAL - pending GEN-PERF-1
          python-version: '3.12'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Load pinned toolchain versions
        shell: bash
        run: |
          echo "ANDROID_NDK_VERSION=$(sed -n 's/^ANDROID_NDK_VERSION=//p' native/llama.cpp.lock)" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$(sed -n 's/^CMAKE_VERSION=//p' native/llama.cpp.lock)" >> "$GITHUB_ENV"

      - name: Install pinned Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install pinned CMake
        run: python -m pip install --disable-pip-version-check "cmake==${CMAKE_VERSION}"

      - name: Compile llama.cpp and the JNI bridge for Android ARM64
        run: native/build-android-cpu.sh

      - name: Verify no Android INTERNET permission was added
        shell: bash
        run: |
          if grep -Eq 'android\.permission\.INTERNET|uses-permission[^>]*INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'The Phase H runtime must not declare INTERNET permission.' >&2
            exit 1
          fi

      - name: Run app, safety, lint, and integrity verification
        run: ./gradlew --no-daemon localVerify

      - name: Enforce Phase H JVM test-count criteria
        run: python native/verify-jvm-test-counts.py

      - name: Re-run safety integrity verification
        run: ./gradlew --no-daemon :app:verifySafetyIntegrity --rerun-tasks

      - name: Re-run Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Package debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload source-built native libraries and APK
        uses: actions/upload-artifact@v4
        with:
          name: phase-h-android-cpu-runtime
          if-no-files-found: error
          path: |
            app/src/main/jniLibs/arm64-v8a/libagent_llama.so
            app/src/main/jniLibs/arm64-v8a/libc++_shared.so
            app/build/outputs/apk/debug/*.apk
